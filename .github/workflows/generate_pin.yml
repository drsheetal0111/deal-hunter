name: Generate Pinterest Pin

on:
  workflow_dispatch:
    inputs:
      asin:
        description: 'Product ASIN'
        required: true
      title:
        description: 'Product title'
        required: true
      category:
        description: 'Product category'
        required: false
        default: 'fashion'
      keywords:
        description: 'Product keywords'
        required: false
        default: ''
      occasion:
        description: 'Occasion'
        required: false
        default: 'Festive & Casual'
      fabric:
        description: 'Fabric type'
        required: false
        default: 'Premium Fabric'
      colors:
        description: 'Product colors'
        required: false
        default: ''
      image_url:
        description: 'Product image URL'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install Python dependencies
        run: |
          pip install Pillow requests cloudinary numpy

      - name: Generate pin
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
        run: |
          python pinterest_bot/pin_generator.py \
            --asin "${{ github.event.inputs.asin }}" \
            --title "${{ github.event.inputs.title }}" \
            --category "${{ github.event.inputs.category }}" \
            --keywords "${{ github.event.inputs.keywords }}" \
            --occasion "${{ github.event.inputs.occasion }}" \
            --fabric "${{ github.event.inputs.fabric }}" \
            --colors "${{ github.event.inputs.colors }}" \
            --image-url "${{ github.event.inputs.image_url }}" \
            --output "pin_${{ github.event.inputs.asin }}.jpg"

      - name: Show pin URL
        run: cat pin_url.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pin-${{ github.event.inputs.asin }}
          path: |
            pin_${{ github.event.inputs.asin }}.jpg
            pin_url.txt

      - name: Commit pin to repo
        run: |
          mkdir -p pins
          cp pin_${{ github.event.inputs.asin }}.jpg pins/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pins/
          git diff --staged --quiet || git commit -m "Add pin ${{ github.event.inputs.asin }}"
          git push
